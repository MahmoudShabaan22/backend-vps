name: Build and Deploy Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mahmoudshabaan22/backend-vps:latest

jobs:

  # ==========================================
  # 1. Build Docker Image and Push to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME


  # ==========================================
  # 2. Deploy Backend on Self-Hosted Runner
  # ==========================================
  deploy:
    name: Deploy Backend
    needs: build-and-push

    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Pull latest Backend image
        working-directory: /opt/myapp
        run: |
          docker compose pull backend

      - name: Recreate Backend container
        working-directory: /opt/myapp
        run: |
          docker compose up -d --force-recreate backend

      - name: Check Backend container
        working-directory: /opt/myapp
        run: |
          docker compose ps backend

      - name: Test Backend
        run: |
          curl -f http://127.0.0.1:5000/

      - name: Remove unused Docker images
        run: |
          docker image prune -f
